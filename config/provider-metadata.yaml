                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
              dependencies:
                digitalocean_database_cluster.postgres-example: |-
                    {
                      "engine": "pg",
                      "name": "example-postgres-cluster",
                      "node_count": 1,
                      "region": "nyc1",
                      "size": "db-s-1vcpu-1gb",
                      "version": "15"
                    }
            - name: example-secure
              manifest: |-
                {
                  "ca_cert": "${file(\"/path/to/ca.pem\")}",

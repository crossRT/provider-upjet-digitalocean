                  "endpoint": "https://user:password@opensearch.example.com:9200",
                  "index_days_max": 14,
                  "index_prefix": "secure-logs",
                  "name": "opensearch-secure",
                  "timeout_seconds": 30
                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
            - name: elasticsearch
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.postgres-example.id}",
                  "endpoint": "https://elasticsearch.example.com:9243",
                  "index_days_max": 30,
                  "index_prefix": "es-logs",
                  "name": "elasticsearch-logs"
                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
            - name: mysql
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.mysql-example.id}",
                  "endpoint": "https://opensearch.example.com:9200",
                  "index_days_max": 7,
                  "index_prefix": "mysql-logs",
                  "name": "mysql-logs"
                }
              references:
                cluster_id: digitalocean_database_cluster.mysql-example.id
              dependencies:
                digitalocean_database_cluster.mysql-example: |-
                    {
                      "engine": "mysql",
                      "name": "example-mysql-cluster",
                      "node_count": 1,
                      "region": "nyc1",
                      "size": "db-s-1vcpu-1gb",
                      "version": "8"
                    }
        argumentDocs:
            ca_cert: '- (Optional) CA certificate for TLS verification in PEM format. Can be specified using file() function. This field is marked as sensitive.'
            cluster_id: '- (Required) UUID of the source database cluster that will forward logs.'
            endpoint: '- (Required) HTTPS URL to the OpenSearch or Elasticsearch cluster (e.g., https://host:port). Note: Only HTTPS URLs are supported.'
            id: '- The composite ID of the logsink in the format cluster_id,logsink_id.'
            index_days_max: '- (Optional) Maximum number of days to retain indices. Must be 1 or greater.'
            index_prefix: '- (Required) Prefix for the indices where logs will be stored.'
            logsink_id: '- The unique identifier for the logsink as returned by the DigitalOcean API.'
            name: '- (Required) Display name for the logsink. Note: This is immutable; changing it will force recreation of the resource.'
            timeout_seconds: '- (Optional) Request timeout for log deliveries in seconds. Must be 1 or greater.'
        importStatements: []
    digitalocean_database_logsink_rsyslog:
        subCategory: Databases
        name: digitalocean_database_logsink_rsyslog
        title: digitalocean_database_logsink_rsyslog
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.postgres-example.id}",
                  "format": "rfc5424",
                  "name": "rsyslog-prod",
                  "port": 514,
                  "server": "192.0.2.10"
                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
              dependencies:
                digitalocean_database_cluster.postgres-example: |-
                    {
                      "engine": "pg",
                      "name": "example-postgres-cluster",
                      "node_count": 1,
                      "region": "nyc1",
                      "size": "db-s-1vcpu-1gb",
                      "version": "15"
                    }
            - name: example-tls
              manifest: |-
                {
                  "ca_cert": "${file(\"/path/to/ca.pem\")}",
                  "cluster_id": "${digitalocean_database_cluster.postgres-example.id}",
                  "format": "rfc5424",
                  "name": "rsyslog-secure",
                  "port": 6514,
                  "server": "logs.example.com",
                  "tls": true
                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
            - name: example-mtls
              manifest: |-
                {
                  "ca_cert": "${file(\"/path/to/ca.pem\")}",
                  "client_cert": "${file(\"/path/to/client.crt\")}",
                  "client_key": "${file(\"/path/to/client.key\")}",
                  "cluster_id": "${digitalocean_database_cluster.postgres-example.id}",
                  "format": "rfc5424",
                  "name": "rsyslog-mtls",
                  "port": 6514,
                  "server": "secure-logs.example.com",
                  "tls": true
                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
            - name: example-custom
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.postgres-example.id}",
                  "format": "custom",
                  "logline": "\u003c%pri%\u003e%timestamp:::date-rfc3339% %HOSTNAME% %app-name% %msg%",
                  "name": "rsyslog-custom",
                  "port": 514,
                  "server": "192.0.2.10",
                  "structured_data": "[example@41058 iut=\"3\"]"
                }
              references:
                cluster_id: digitalocean_database_cluster.postgres-example.id
        argumentDocs:
            ca_cert: '- (Optional) CA certificate for TLS verification in PEM format. Can be specified using file() function.'
            client_cert: '- (Optional) Client certificate for mutual TLS authentication in PEM format. Note: Requires tls to be true.'
            client_key: '- (Optional) Client private key for mutual TLS authentication in PEM format. Note: Requires tls to be true. This field is marked as sensitive.'
            cluster_id: '- (Required) UUID of the source database cluster that will forward logs.'
            format: '- (Optional) Log format to use. Must be one of rfc5424 (default), rfc3164, or custom.'
            id: '- The composite ID of the logsink in the format cluster_id,logsink_id.'
            logline: '- (Optional) Custom logline template. Required when format is set to custom. Supports rsyslog-style templating with the following tokens: %HOSTNAME%, %app-name%, %msg%, %msgid%, %pri%, %procid%, %structured-data%, %timestamp%, and %timestamp:::date-rfc3339%.'
            logsink_id: '- The unique identifier for the logsink as returned by the DigitalOcean API.'
            name: '- (Required) Display name for the logsink. Note: This is immutable; changing it will force recreation of the resource.'
            port: '- (Required) Port number for the rsyslog server. Must be between 1 and 65535.'
            server: '- (Required) Hostname or IP address of the rsyslog server.'
            structured_data: '- (Optional) Content of the structured data block for RFC5424 messages.'
            tls: '- (Optional) Enable TLS encryption for the rsyslog connection. Defaults to false. Note: It is highly recommended to enable TLS as log messages may contain sensitive information.'
        importStatements: []
    digitalocean_database_mongodb_config:
        subCategory: Databases
        name: digitalocean_database_mongodb_config
        title: digitalocean_database_mongodb_config
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.example.id}",
                  "default_read_concern": "majority",
                  "default_write_concern": "majority",
                  "slow_op_threshold_ms": 100,
                  "transaction_lifetime_limit_seconds": 100,
                  "verbosity": 3
                }
              references:
                cluster_id: digitalocean_database_cluster.example.id
              dependencies:
                digitalocean_database_cluster.example: |-
                    {
                      "engine": "mongodb",
                      "name": "example-mongodb-cluster",
                      "node_count": 1,
                      "region": "nyc3",
                      "size": "db-s-1vcpu-1gb",
                      "version": "7"
                    }
        argumentDocs:
            cluster_id: '- (Required)  The ID of the target MongoDB cluster.'
            default_read_concern: '- (Optional) Specifies the default consistency behavior of reads from the database. Data that is returned from the query with may or may not have been acknowledged by all nodes in the replicaset depending on this value. Learn more here.'
            default_write_concern: '- (Optional) Describes the level of acknowledgment requested from MongoDB for write operations clusters. This field can set to either majority or a number0...n which will describe the number of nodes that must acknowledge the write operation before it is fully accepted. Setting to 0 will request no acknowledgement of the write operation. Learn more here.'
            slow_op_threshold_ms: '- (Optional) Operations that run for longer than this threshold are considered slow which are then recorded to the diagnostic logs. Higher log levels (verbosity) will record all operations regardless of this threshold on the primary node. Changing this parameter will lead to a restart of the MongoDB service. Learn more here.'
            transaction_lifetime_limit_seconds: '- (Optional) Specifies the lifetime of multi-document transactions. Transactions that exceed this limit are considered expired and will be aborted by a periodic cleanup process. The cleanup process runs every transactionLifetimeLimitSeconds/2 seconds or at least once every 60 seconds. Changing this parameter will lead to a restart of the MongoDB service. Learn more here.'
            verbosity: '- (Optional) The log message verbosity level. The verbosity level determines the amount of Informational and Debug messages MongoDB outputs. 0 includes informational messages while 1...5 increases the level to include debug messages. Changing this parameter will lead to a restart of the MongoDB service. Learn more here.'
        importStatements: []
    digitalocean_database_mysql_config:
        subCategory: Databases
        name: digitalocean_database_mysql_config
        title: digitalocean_database_mysql_config
        argumentDocs:
            cluster_id: '- (Required)  The ID of the target MySQL cluster.'
            dbname: '- (Required) The name of the default database.'
            disable_ssl: '- (Optional) When set to true, enables SSL encryption when connecting to the source database.'
            host: '- (Required) The FQDN pointing to the database cluster''s current primary node.'
            ignore_dbs: '- (Optional) A list of databases that should be ignored during migration.'
            password: '- (Required) A randomly generated password for the default user.'
            port: '- (Required) The port on which the database cluster is listening.'
            source: '- (Required) Configuration for migration'
            username: '- (Required) The default user for the database.'
        importStatements: []
    digitalocean_database_opensearch_config:
        subCategory: Databases
        name: digitalocean_database_opensearch_config
        title: digitalocean_database_opensearch_config
        examples:
            - name: example
              manifest: |-
                {
                  "action_auto_create_index_enabled": true,
                  "action_destructive_requires_name": false,
                  "cluster_id": "${digitalocean_database_cluster.example.id}",
                  "cluster_max_shards_per_node": 100,
                  "cluster_routing_allocation_node_concurrent_recoveries": 2,
                  "enable_security_audit": false,
                  "http_max_content_length_bytes": 100000000,
                  "http_max_header_size_bytes": 8192,
                  "http_max_initial_line_length_bytes": 4096,
                  "indices_fielddata_cache_size_percentage": 3,
                  "indices_memory_index_buffer_size_percentage": 10,
                  "indices_memory_max_index_buffer_size_mb": 3,
                  "indices_memory_min_index_buffer_size_mb": 48,
                  "indices_queries_cache_size_percentage": 10,
                  "indices_query_bool_max_clause_count": 1024,
                  "indices_recovery_max_concurrent_file_chunks": 2,
                  "indices_recovery_max_mb_per_sec": 40,
                  "ism_enabled": true,
                  "ism_history_enabled": true,
                  "ism_history_max_age_hours": 24,
                  "ism_history_max_docs": 2500000,
                  "ism_history_rollover_check_period_hours": 8,
                  "ism_history_rollover_retention_period_days": 30,
                  "override_main_response_version": false,
                  "plugins_alerting_filter_by_backend_roles_enabled": false,
                  "reindex_remote_whitelist": [
                    "cloud.digitalocean.com:8080"
                  ],
                  "script_max_compilations_rate": "use-context",
                  "search_max_buckets": 10000,
                  "thread_pool_analyze_queue_size": 10,
                  "thread_pool_analyze_size": 1,
                  "thread_pool_force_merge_size": 1,
                  "thread_pool_get_queue_size": 10,
                  "thread_pool_get_size": 1,
                  "thread_pool_search_queue_size": 10,
                  "thread_pool_search_size": 1,
                  "thread_pool_search_throttled_queue_size": 10,
                  "thread_pool_search_throttled_size": 1,
                  "thread_pool_write_queue_size": 10,
                  "thread_pool_write_size": 1
                }
              references:
                cluster_id: digitalocean_database_cluster.example.id
              dependencies:
                digitalocean_database_cluster.example: |-
                    {
                      "engine": "opensearch",
                      "name": "example-opensearch-cluster",
                      "node_count": 1,
                      "region": "nyc3",
                      "size": "db-s-1vcpu-2gb",
                      "version": "2"
                    }
        argumentDocs:
            action_auto_create_index_enabled: '- (Optional) Specifices whether to allow automatic creation of indices. Default: true'
            action_destructive_requires_name: '- (Optional) Specifies whether to require explicit index names when deleting indices.'
            cluster_id: '- (Required) The ID of the target Opensearch cluster.'
            cluster_max_shards_per_node: '- (Optional) Maximum number of shards allowed per data node.'
            cluster_routing_allocation_node_concurrent_recoveries: '- (Optional) Maximum concurrent incoming/outgoing shard recoveries (normally replicas) are allowed to happen per node. Default: 2'
            enable_security_audit: '- (Optional) Specifies whether to allow security audit logging. Default: false'
            http_max_content_length_bytes: '- (Optional) Maximum content length for HTTP requests to the OpenSearch HTTP API, in bytes. Default: 100000000'
            http_max_header_size_bytes: '- (Optional) Maximum size of allowed headers, in bytes. Default: 8192'
            http_max_initial_line_length_bytes: '- (Optional) Maximum length of an HTTP URL, in bytes. Default: 4096'
            indices_fielddata_cache_size_percentage: '- (Optional) Maximum amount of heap memory used for field data cache, expressed as a percentage. Decreasing the value too much will increase overhead of loading field data. Increasing the value too much will decrease amount of heap available for other operations.'
            indices_memory_index_buffer_size_percentage: '- (Optional) Total amount of heap used for indexing buffer before writing segments to disk, expressed as a percentage. Too low value will slow down indexing; too high value will increase indexing performance but causes performance issues for query performance. Default: 10'
            indices_memory_max_index_buffer_size_mb: '- (Optional) Maximum amount of heap used for indexing buffer before writing segments to disk, in mb. Works in conjunction with indices_memory_index_buffer_size_percentage, each being enforced. The default is unbounded.'
            indices_memory_min_index_buffer_size_mb: '- (Optional) Minimum amount of heap used for indexing buffer before writing segments to disk, in mb. Works in conjunction with indices_memory_index_buffer_size_percentage, each being enforced. Default: 48'
            indices_queries_cache_size_percentage: '- (Optional) Maximum amount of heap used for query cache. Too low value will decrease query performance and increase performance for other operations; too high value will cause issues with other functionality. Default: 10'
            indices_query_bool_max_clause_count: '- (Optional) Maximum number of clauses Lucene BooleanQuery can have. Only increase it if necessary, as it may cause performance issues. Default: 1024'
            indices_recovery_max_concurrent_file_chunks: '- (Optional) Maximum number of file chunks sent in parallel for each recovery. Default: 2'
            indices_recovery_max_mb_per_sec: '- (Optional) Limits total inbound and outbound recovery traffic for each node, expressed in mb per second. Applies to both peer recoveries as well as snapshot recoveries (i.e., restores from a snapshot). Default: 40'
            ism_enabled: '- (Optional) Specifies whether ISM is enabled or not. Default: true'
            ism_history_enabled: '- (Optional) Specifies whether audit history is enabled or not. The logs from ISM are automatically indexed to a logs document. Default: true'
            ism_history_max_age_hours: '- (Optional) Maximum age before rolling over the audit history index, in hours. Default: 24'
            ism_history_max_docs: '- (Optional) Maximum number of documents before rolling over the audit history index. Default: 2500000'
            ism_history_rollover_check_period_hours: '- (Optional) The time between rollover checks for the audit history index, in hours. Default: 8'
            ism_history_rollover_retention_period_days: '- (Optional) Length of time long audit history indices are kept, in days. Default: 30'
            override_main_response_version: '- (Optional) Compatibility mode sets OpenSearch to report its version as 7.10 so clients continue to work. Default: false'
            plugins_alerting_filter_by_backend_roles_enabled: '- (Optional) Enable or disable filtering of alerting by backend roles. Default: false'
            reindex_remote_whitelist: '- (Optional) Allowlist of remote IP addresses for reindexing. Changing this value will cause all OpenSearch instances to restart.'
            script_max_compilations_rate: '- (Optional) Limits the number of inline script compilations within a period of time. Default is use-context'
            search_max_buckets: '- (Optional) Maximum number of aggregation buckets allowed in a single response. Default: 10000'
            thread_pool_analyze_queue_size: '- (Optional) Size of queue for operations in the analyze thread pool.'
            thread_pool_analyze_size: '- (Optional) Number of workers in the analyze operation thread pool. Do note this may have maximum value depending on CPU count - value is automatically lowered if set to higher than maximum value.'
            thread_pool_force_merge_size: '- (Optional) Number of workers in the force merge operation thread pool. This pool is used for forcing a merge between shards of one or more indices. Do note this may have maximum value depending on CPU count - value is automatically lowered if set to higher than maximum value.'
            thread_pool_get_queue_size: '- (Optional) Size of queue for operations in the get thread pool.'
            thread_pool_get_size: '- (Optional) Number of workers in the get operation thread pool. Do note this may have maximum value depending on CPU count - value is automatically lowered if set to higher than maximum value.'
            thread_pool_search_queue_size: '- (Optional) Size of queue for operations in the search thread pool.'
            thread_pool_search_size: '- (Optional) Number of workers in the search operation thread pool. Do note this may have maximum value depending on CPU count - value is automatically lowered if set to higher than maximum value.'
            thread_pool_search_throttled_queue_size: '- (Optional) Size of queue for operations in the search throttled thread pool.'
            thread_pool_search_throttled_size: '- (Optional) Number of workers in the search throttled operation thread pool. This pool is used for searching frozen indices. Do note this may have maximum value depending on CPU count - value is automatically lowered if set to higher than maximum value.'
            thread_pool_write_queue_size: '- (Optional) Size of queue for operations in the write thread pool.'
            thread_pool_write_size: '- (Optional) Number of workers in the write operation thread pool. Do note this may have maximum value depending on CPU count - value is automatically lowered if set to higher than maximum value.'
        importStatements: []
    digitalocean_database_postgresql_config:
        subCategory: Databases
        name: digitalocean_database_postgresql_config
        title: digitalocean_database_postgresql_config
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.example.id}",
                  "timezone": "UTC",
                  "work_mem": 16
                }
              references:
                cluster_id: digitalocean_database_cluster.example.id
              dependencies:
                digitalocean_database_cluster.example: |-
                    {
                      "engine": "pg",
                      "name": "example-postgresql-cluster",
                      "node_count": 1,
                      "region": "nyc1",
                      "size": "db-s-1vcpu-1gb",
                      "version": "15"
                    }
        argumentDocs:
            autovacuum_analyze_scale_factor: '- (Optional)  Specifies a fraction, in a decimal value, of the table size to add to autovacuum_analyze_threshold when deciding whether to trigger an ANALYZE. The default is 0.2 (20% of table size).'
            autovacuum_analyze_threshold: '- (Optional)  Specifies the minimum number of inserted, updated, or deleted tuples needed to trigger an ANALYZE in any one table. The default is 50 tuples.'
            autovacuum_freeze_max_age: '- (Optional)  Specifies the maximum age (in transactions) that a table''s pg_class.relfrozenxid field can attain before a VACUUM operation is forced to prevent transaction ID wraparound within the table. Note that the system will launch autovacuum processes to prevent wraparound even when autovacuum is otherwise disabled. This parameter will cause the server to be restarted.'
            autovacuum_max_workers: '- (Optional)  Specifies the maximum number of autovacuum processes (other than the autovacuum launcher) that may be running at any one time. The default is three. This parameter can only be set at server start.'
            autovacuum_naptime: '- (Optional)  Specifies the minimum delay, in seconds, between autovacuum runs on any given database. The default is one minute.'
            autovacuum_vacuum_cost_delay: '- (Optional)  Specifies the cost delay value, in milliseconds, that will be used in automatic VACUUM operations. If -1, uses the regular vacuum_cost_delay value, which is 20 milliseconds.'
            autovacuum_vacuum_cost_limit: '- (Optional)  Specifies the cost limit value that will be used in automatic VACUUM operations. If -1 is specified (which is the default), the regular vacuum_cost_limit value will be used.'
            autovacuum_vacuum_scale_factor: '- (Optional)  Specifies a fraction, in a decimal value, of the table size to add to autovacuum_vacuum_threshold when deciding whether to trigger a VACUUM. The default is 0.2 (20% of table size).'
            autovacuum_vacuum_threshold: '- (Optional)  Specifies the minimum number of updated or deleted tuples needed to trigger a VACUUM in any one table. The default is 50 tuples.'
            backup_hour: '- (Optional)  The hour of day (in UTC) when backup for the service starts. New backup only starts if previous backup has already completed.'
            backup_minute: '- (Optional)  The minute of the backup hour when backup for the service starts. New backup is only started if previous backup has already completed.'
            bgwriter_delay: '- (Optional)  Specifies the delay, in milliseconds, between activity rounds for the background writer. Default is 200 ms.'
            bgwriter_flush_after: '- (Optional)  The amount of kilobytes that need to be written by the background writer before attempting to force the OS to issue these writes to underlying storage. Specified in kilobytes, default is 512. Setting of 0 disables forced writeback.'
            bgwriter_lru_maxpages: '- (Optional)  The maximum number of buffers that the background writer can write. Setting this to zero disables background writing. Default is 100.'
            bgwriter_lru_multiplier: '- (Optional)  The average recent need for new buffers is multiplied by bgwriter_lru_multiplier to arrive at an estimate of the number that will be needed during the next round, (up to bgwriter_lru_maxpages). 1.0 represents a “just in time” policy of writing exactly the number of buffers predicted to be needed. Larger values provide some cushion against spikes in demand, while smaller values intentionally leave writes to be done by server processes. The default is 2.0.'
            cluster_id: '- (Required)  The ID of the target PostgreSQL cluster.'
            deadlock_timeout: '- (Optional)  The amount of time, in milliseconds, to wait on a lock before checking to see if there is a deadlock condition.'
            default_toast_compression: '- (Optional)  Specifies the default TOAST compression method for values of compressible columns (the default is lz4). Supported values are: lz4, pglz.'
            idle_in_transaction_session_timeout: '- (Optional)  Time out sessions with open transactions after this number of milliseconds'
            jit: '- (Optional)  Activates, in a boolean, the system-wide use of Just-in-Time Compilation (JIT).'
            log_autovacuum_min_duration: '- (Optional)  Causes each action executed by autovacuum to be logged if it ran for at least the specified number of milliseconds. Setting this to zero logs all autovacuum actions. Minus-one (the default) disables logging autovacuum actions.'
            log_error_verbosity: '- (Optional)  Controls the amount of detail written in the server log for each message that is logged. Supported values are: TERSE, DEFAULT, VERBOSE.'
            log_line_prefix: '- (Optional)  Selects one of the available log-formats. These can support popular log analyzers like pgbadger, pganalyze, etc. Supported values are: pid=%p,user=%u,db=%d,app=%a,client=%h, %m [%p] %q[user=%u,db=%d,app=%a], %t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h.'
            log_min_duration_statement: '- (Optional)  Log statements that take more than this number of milliseconds to run. If -1, disables.'
            max_files_per_process: '- (Optional)  PostgreSQL maximum number of files that can be open per process.'
            max_locks_per_transaction: '- (Optional)  PostgreSQL maximum locks per transaction. Once increased, this parameter cannot be lowered from its set value.'
            max_logical_replication_workers: '- (Optional)  PostgreSQL maximum logical replication workers (taken from the pool of max_parallel_workers).'
            max_parallel_workers: '- (Optional)  Sets the maximum number of workers that the system can support for parallel queries.'
            max_parallel_workers_per_gather: '- (Optional)  Sets the maximum number of workers that can be started by a single Gather or Gather Merge node.'
            max_pred_locks_per_transaction: '- (Optional)  PostgreSQL maximum predicate locks per transaction.'
            max_prepared_transactions: '- (Optional)  PostgreSQL maximum prepared transactions. Once increased, this parameter cannot be lowered from its set value.'
            max_replication_slots: '- (Optional)  PostgreSQL maximum replication slots.'
            max_stack_depth: '- (Optional)  Maximum depth of the stack in bytes.'
            max_standby_archive_delay: '- (Optional)  Max standby archive delay in milliseconds.'
            max_standby_streaming_delay: '- (Optional)  Max standby streaming delay in milliseconds.'
            max_wal_senders: '- (Optional)  PostgreSQL maximum WAL senders. Once increased, this parameter cannot be lowered from its set value.'
            max_worker_processes: '- (Optional)  Sets the maximum number of background processes that the system can support. Once increased, this parameter cannot be lowered from its set value.'
            pg_partman_bgw_interval: '- (Optional)  Sets the time interval to run pg_partman''s scheduled tasks.'
            pg_partman_bgw_role: '- (Optional)  Controls which role to use for pg_partman''s scheduled background tasks. Must consist of alpha-numeric characters, dots, underscores, or dashes. May not start with dash or dot. Maximum of 64 characters.'
            pg_stat_statements_track: '- (Optional)  Controls which statements are counted. Specify ''top'' to track top-level statements (those issued directly by clients), ''all'' to also track nested statements (such as statements invoked within functions), or ''none'' to disable statement statistics collection. The default value is top. Supported values are: all, top, none.'
            pgbouncer: '- (Optional)  PGBouncer connection pooling settings'
            shared_buffers_percentage: '- (Optional)  Percentage of total RAM that the database server uses for shared memory buffers. Valid range is 20-60 (float), which corresponds to 20% - 60%. This setting adjusts the shared_buffers configuration value.'
            temp_file_limit: '- (Optional)  PostgreSQL temporary file limit in KiB. If -1, sets to unlimited.'
            timescaledb: '- (Optional)  TimescaleDB extension configuration values'
            timezone: '- (Optional)  PostgreSQL service timezone'
            track_activity_query_size: '- (Optional)  Specifies the number of bytes reserved to track the currently executing command for each active session.'
            track_commit_timestamp: '- (Optional)  Record commit time of transactions. The default value is top. Supported values are: off, on.'
            track_functions: '- (Optional)  Enables tracking of function call counts and time used. The default value is top. Supported values are: all, pl, none.'
            track_io_timing: '- (Optional)  Enables timing of database I/O calls. This parameter is off by default, because it will repeatedly query the operating system for the current time, which may cause significant overhead on some platforms. The default value is top. Supported values are: off, on.'
            wal_sender_timeout: '- (Optional)  Terminate replication connections that are inactive for longer than this amount of time, in milliseconds. Setting this value to zero disables the timeout. Must be either 0 or between 5000 and 10800000.'
            wal_writer_delay: '- (Optional)  WAL flush interval in milliseconds. Note that setting this value to lower than the default 200ms may negatively impact performance'
            work_mem: '- (Optional)  The maximum amount of memory, in MB, used by a query operation (such as a sort or hash table) before writing to temporary disk files. Default is 1MB + 0.075% of total RAM (up to 32MB).'
        importStatements: []
    digitalocean_database_redis_config:
        subCategory: Databases
        name: digitalocean_database_redis_config
        title: digitalocean_database_redis_config
        examples:
            - name: example
              manifest: |-
                {
                  "cluster_id": "${digitalocean_database_cluster.example.id}",
                  "maxmemory_policy": "allkeys-lru",
                  "notify_keyspace_events": "KEA",
                  "timeout": 90
                }
              references:
                cluster_id: digitalocean_database_cluster.example.id
              dependencies:
                digitalocean_database_cluster.example: |-
                    {
                      "engine": "redis",
                      "name": "example-redis-cluster",
                      "node_count": 1,
                      "region": "nyc1",
                      "size": "db-s-1vcpu-1gb",
                      "version": "7"
                    }
        argumentDocs:
            "25060": is opened for non-SSL connections, while port 25061 remains available for SSL connections.
            "25061": .
            acl_channels_default: '- (Optional) Determines default pub/sub channels'' ACL for new users if an ACL is not supplied. When this option is not defined, allchannels is assumed to keep backward compatibility. This option doesn''t affect Redis'' acl-pubsub-default configuration. Supported values are: allchannels and resetchannels'
            cluster_id: '- (Required)  The ID of the target Redis cluster.'
            io_threads: '- (Optional) The Redis IO thread count.'
            lfu_decay_time: '- (Optional) The LFU maxmemory policy counter decay time in minutes.'
            lfu_log_factor: '- (Optional) The counter logarithm factor for volatile-lfu and allkeys-lfu maxmemory policies.'
            maxmemory_policy: '- (Optional) A string specifying the desired eviction policy for the Redis cluster.Supported values are: noeviction, allkeys-lru, allkeys-random, volatile-lru, volatile-random, volatile-ttl'
            notify_keyspace_events: '- (Optional) The notify-keyspace-events option. Requires at least K or E.'
            number_of_databases: '- (Optional) The number of Redis databases. Changing this will cause a restart of Redis service.'
            persistence: '- (Optional) When persistence is rdb, Redis does RDB dumps each 10 minutes if any key is changed. Also RDB dumps are done according to backup schedule for backup purposes. When persistence is off, no RDB dumps and backups are done, so data can be lost at any moment if service is restarted for any reason, or if service is powered off. Also service can''t be forked.'
            pubsub_client_output_buffer_limit: '- (Optional) The output buffer limit for pub/sub clients in MB. The value is the hard limit, the soft limit is 1/4 of the hard limit. When setting the limit, be mindful of the available memory in the selected service plan.'
            ssl: '- (Optional) A boolean indicating whether to require SSL to access Redis.'
            timeout: '- (Optional) The Redis idle connection timeout in seconds.'
        importStatements: []
    digitalocean_database_replica:
        subCategory: Databases

    digitalocean_kubernetes_cluster:
        subCategory: Kubernetes
        name: digitalocean_kubernetes_cluster
        title: digitalocean_kubernetes_cluster
        examples:
            - name: foo
              manifest: |-
                {
                  "name": "foo",
                  "node_pool": [
                    {
                      "name": "worker-pool",
                      "node_count": 3,
                      "size": "s-2vcpu-2gb",
                      "taint": [
                        {
                          "effect": "NoSchedule",
                          "key": "workloadKind",
                          "value": "database"
                        }
                      ]
                    }
                  ],
                  "region": "nyc1",
                  "version": "latest"
                }
            - name: foo
              manifest: |-
                {
                  "name": "foo",
                  "node_pool": [
                    {
                      "auto_scale": true,
                      "max_nodes": 5,
                      "min_nodes": 1,
                      "name": "autoscale-worker-pool",
                      "size": "s-2vcpu-2gb"
                    }
                  ],
                  "region": "nyc1",
                  "version": "1.22.8-do.1"
                }
            - name: foo
              manifest: |-
                {
                  "auto_upgrade": true,
                  "maintenance_policy": [
                    {
                      "day": "sunday",
                      "start_time": "04:00"
                    }
                  ],
                  "name": "foo",
                  "node_pool": [
                    {
                      "name": "default",
                      "node_count": 3,
                      "size": "s-1vcpu-2gb"
                    }
                  ],
                  "region": "nyc1",
                  "version": "${data.digitalocean_kubernetes_versions.example.latest_version}"
                }
              references:
                version: data.digitalocean_kubernetes_versions.example.latest_version
            - name: foo
              manifest: |-
                {
                  "isolated_workers": true,
                  "name": "foo",
                  "node_pool": [
                    {
                      "name": "worker-pool",
                      "node_count": 3,
                      "size": "s-2vcpu-2gb"
                    }
                  ],
                  "region": "nyc1",
                  "version": "latest",
                  "vpc_uuid": "${digitalocean_vpc.example.id}"
                }
              references:
                vpc_uuid: digitalocean_vpc.example.id
        argumentDocs:
            actual_node_count: '- A computed field representing the actual number of nodes in the node pool, which is especially useful when auto-scaling is enabled.'
            allowed_addresses: '- (Required) A list of addresses allowed (CIDR notation).'
            amd_gpu_device_metrics_exporter_plugin: '- (Optional) Block containing options for the AMD GPU device metrics exporter component. If not specified, the component will not be installed in the cluster.'
            amd_gpu_device_plugin: '- (Optional) Block containing options for the AMD GPU device plugin component. If not specified, the component will be enabled by default for clusters with AMD GPU nodes. Mutually exclusive with amd_gpu_dra_driver.'
            amd_gpu_dra_driver: '- (Optional) Block containing options for the AMD GPU DRA driver component. Mutually exclusive with amd_gpu_device_plugin.'
            auto_scale: '- (Optional) Enable auto-scaling of the number of nodes in the node pool within the given min/max range.'
            auto_upgrade: '- (Optional) A boolean value indicating whether the cluster will be automatically upgraded to new patch releases during its maintenance window.'
            client_certificate: '- The base64 encoded public certificate used by clients to access the cluster. Only available if token authentication is not supported on your cluster.'
            client_id: '- (Optional) The OIDC client ID for the cluster SSO configuration.'
            client_key: '- The base64 encoded private key used by clients to access the cluster. Only available if token authentication is not supported on your cluster.'
            cluster_autoscaler_configuration: '- (Optional) Block containing options for cluster auto-scaling. For more information.'
            cluster_ca_certificate: '- The base64 encoded public certificate for the cluster''s certificate authority.'
            cluster_subnet: '- (Optional) The range of IP addresses in the overlay network of the Kubernetes cluster. For more information, see here.'
            control_plane_firewall: '- (Optional) A block representing the cluster''s control plane firewall'
            coredns_autoscaler: '- (Optional) Block containing options for the CoreDNS Autoscaler component, which scales CoreDNS replicas in proportion to the cluster''s size. Default: true (for 1.36.0 and later)'
            created_at: '- The date and time when the Kubernetes cluster was created.'
            day: '- (Required) The day of the maintenance window policy. May be one of "monday" through "sunday", or "any" to indicate an arbitrary week day.'
            destroy_all_associated_resources: '- (Optional) Use with caution. When set to true, all associated DigitalOcean resources created via the Kubernetes API (load balancers, volumes, and volume snapshots) will be destroyed along with the cluster when it is destroyed.'
            droplet_id: '- The id of the node''s droplet'
            duration: A string denoting the duration of the service window, e.g., "04:00".
            effect: '- How the node reacts to pods that it won''t tolerate. Available effect values are: "NoSchedule", "PreferNoSchedule", "NoExecute".'
            enabled: '- (Required) Boolean flag whether the firewall should be enabled or not.'
            endpoint: '- The base URL of the API server on the Kubernetes master node.'
            expanders: '- (Optional) A list of cluster autoscaler expander strategies to apply in order when selecting which node pool to scale up. Valid values are random, priority, and least-waste. The autoscaler uses each expander from the list to narrow the selection until a single node pool remains. If multiple node pools remain after all expanders are applied, one is chosen at random. When using the priority expander, configure priorities in the cluster-autoscaler-priority-expander ConfigMap in the kube-system namespace (see Configuring Priority Expander).'
            expires_at: '- The date and time when the credentials will expire and need to be regenerated.'
            gpu_operator_ready: '- (Optional) Enable/disable launching GPU nodes in the cluster with images without GPU drivers, allowing GPU operators to manage drivers. Mutually exclusive with other GPU-related cluster options, such as nvidia_gpu_dra_driver and amd_gpu_dra_driver. Default: false'
            gpu_partition_mode: '- (Optional) The AMD GPU partition mode to use for nodes in this pool. Valid values are AMD_PARTITION_MODE_SPX_NPS1 and AMD_PARTITION_MODE_DPX_NPS2. This can only be set when the pool is created.'
            ha: '- (Optional) Enable/disable the high availability control plane for a cluster. Once enabled for a cluster, high availability cannot be disabled. Default: true (for 1.36.0 and later)'
            host: '- The URL of the API server on the Kubernetes master node.'
            id: '- A unique ID that can be used to identify and reference a Kubernetes cluster.'
            ipv4_address: '- The public IPv4 address of the Kubernetes master node. This will not be set if high availability is configured on the cluster (v1.21+)'
            isolated_workers: '- (Optional) Enable/disable isolated worker nodes for the cluster. When enabled, each worker node runs on dedicated hardware. This can only be set at creation time. The cluster''s VPC must have a NAT gateway attached. Default: false'
            issuer_url: '- (Optional) The OIDC issuer URL for the cluster SSO configuration.'
            key: '- An arbitrary string. The "key" and "value" fields of the "taint" object form a key-value pair.'
            kube_config.0: '- A representation of the Kubernetes cluster''s kubeconfig with the following attributes:'
            kubeconfig_expire_seconds: '- (Optional) The duration in seconds that the returned Kubernetes credentials will be valid. If not set or 0, the credentials will have a 7 day expiry.'
            labels: '- (Optional) A map of key/value pairs to apply to nodes in the pool. The labels are exposed in the Kubernetes API as labels in the metadata of the corresponding Node resources.'
            maintenance_policy: '- (Optional) A block representing the cluster''s maintenance window. Updates will be applied within this window. If not specified, a default maintenance window will be chosen. auto_upgrade must be set to true for this to have an effect.'
            max_nodes: '- (Optional) If auto-scaling is enabled, this represents the maximum number of nodes that the node pool can be scaled up to.'
            min_nodes: '- (Optional) If auto-scaling is enabled, this represents the minimum number of nodes that the node pool can be scaled down to.'
            name: '- (Required) A name for the Kubernetes cluster.'
            nfs_csi_plugin: '- (Optional) Block containing options for the NFS CSI driver plugin component. If not specified, the NFS CSI plugin will not be installed in the cluster.'
            node_count: '- (Optional) The number of Droplet instances in the node pool. If auto-scaling is enabled, this should only be set if the desired result is to explicitly reset the number of nodes to this value. If auto-scaling is enabled, and the node count is outside of the given min/max range, it will use the min nodes value.'
            node_pool: '- (Required) A block representing the cluster''s default node pool. Additional node pools may be added to the cluster using the digitalocean_kubernetes_node_pool resource. The following arguments may be specified:'
            nodes: '- A list of nodes in the pool. Each node exports the following attributes:'
            nvidia_gpu_device_plugin: '- (Optional) Block containing options for the NVIDIA GPU device plugin component. If not specified, the component will be enabled by default for clusters with NVIDIA GPU nodes. Mutually exclusive with nvidia_gpu_dra_driver.'
            nvidia_gpu_dra_driver: '- (Optional) Block containing options for the NVIDIA GPU DRA driver component. Mutually exclusive with nvidia_gpu_device_plugin.'
            p2p_oci_registry_plugin: '- (Optional) Block containing options for the Peer-to-peer OCI registry plugin component. If not specified, the p2p-oci-registry-plugin component will not be installed in the cluster.'
            raw_config: '- The full contents of the Kubernetes cluster''s kubeconfig file.'
            rdma_shared_device_plugin: '- (Optional) Block containing options for the RDMA Shared Device Plugin (k8s-rdma-shared-dev-plugin) component. If not specified, the component will be enabled by default for clusters with GPU nodes connected to a dedicated high-speed networking fabric.'
            region: '- (Required) The slug identifier for the region where the Kubernetes cluster will be created.'
            registry_integration: '- (optional) Enables or disables the DigitalOcean container registry integration for the cluster. This requires that a container registry has first been created for the account. Default: false'
            required: '- (Optional) Boolean flag indicating whether SSO is required as the only authentication method for the cluster. Default: false'
            routing_agent: '- (Optional) Block containing options for the routing-agent component. If not specified, the routing-agent component will not be installed in the cluster.'
            scale_down_unneeded_time: '- (Optional) String setting how long a node should be unneeded before it''s eligible for scale down.'
            scale_down_utilization_threshold: '- (Optional) Float setting the Node utilization level, defined as sum of requested resources divided by capacity, in which a node can be considered for scale down.'
            service_subnet: '- (Optional) The range of assignable IP addresses for services running in the Kubernetes cluster. For more information, see here.'
            size: '- (Required) The slug identifier for the type of Droplet to be used as workers in the node pool.'
            sso: '- (Optional) Block containing Single Sign-On (SSO) configuration for the cluster using OpenID Connect (OIDC).'
            start_time: (Required) The start time in UTC of the maintenance window policy in 24-hour clock format / HH:MM notation (e.g., 15:00).
            status: '-  A string indicating the current status of the cluster. Potential values include running, provisioning, and errored.'
            surge_upgrade: '- (Optional) Enable/disable surge upgrades for a cluster. Default: true'
            tags: '- (Optional) A list of tag names applied to the node pool.'
            taint: '- A block representing a taint applied to all nodes in the pool. Each taint exports the following attributes (taints must be unique by key and effect pair):'
            token: '- The DigitalOcean API access token used by clients to access the cluster.'
            updated_at: '- The date and time when the Kubernetes cluster was last updated.'
            urn: '- The uniform resource name (URN) for the Kubernetes cluster.'
            value: '- An arbitrary string. The "key" and "value" fields of the "taint" object form a key-value pair.'
            version: '- (Required) The slug identifier for the version of Kubernetes used for the cluster. Use doctl to find the available versions doctl kubernetes options versions. (Note: A cluster may only be upgraded to newer versions in-place. If the version is decreased, a new resource will be created.)'
            vpc_uuid: '- (Optional) The ID of the VPC where the Kubernetes cluster will be located.'
            worker_subnet_uuid: '- (Optional) The ID of the VPC subnet for placing worker nodes. Must be a valid subnet in the cluster VPC. Requires that vpc_uuid is also set.'
        importStatements: []
    digitalocean_kubernetes_node_pool:
        subCategory: Kubernetes
        name: digitalocean_kubernetes_node_pool
        title: digitalocean_kubernetes_node_pool
        examples:
            - name: bar
              manifest: |-
                {
                  "cluster_id": "${digitalocean_kubernetes_cluster.foo.id}",
                  "labels": {
                    "priority": "high",
                    "service": "backend"
                  },
                  "name": "backend-pool",
                  "node_count": 2,
                  "size": "c-2",
                  "tags": [
                    "backend"
                  ],
                  "taint": [
                    {
                      "effect": "NoSchedule",
                      "key": "workloadKind",
                      "value": "database"
                    }
                  ]
                }
              references:
                cluster_id: digitalocean_kubernetes_cluster.foo.id
              dependencies:
                digitalocean_kubernetes_cluster.foo: |-
                    {
                      "name": "foo",
                      "node_pool": [
                        {
                          "name": "front-end-pool",
                          "node_count": 3,
                          "size": "s-2vcpu-2gb"
                        }
                      ],
                      "region": "nyc1",
                      "version": "1.22.8-do.1"
                    }
            - name: autoscale-pool-01
              manifest: |-
                {
                  "auto_scale": true,
                  "cluster_id": "${digitalocean_kubernetes_cluster.foo.id}",
                  "max_nodes": 5,
                  "min_nodes": 1,
                  "name": "autoscale-pool-01",
                  "size": "s-1vcpu-2gb"
                }
              references:
                cluster_id: digitalocean_kubernetes_cluster.foo.id
        argumentDocs:
            actual_node_count: '- A computed field representing the actual number of nodes in the node pool, which is especially useful when auto-scaling is enabled.'
            auto_scale: '- (Optional) Enable auto-scaling of the number of nodes in the node pool within the given min/max range.'
            cluster_id: '- (Required) The ID of the Kubernetes cluster to which the node pool is associated.'
            created_at: '- The date and time when the node was created.'
            droplet_id: '- The id of the node''s droplet'
            effect: '- How the node reacts to pods that it won''t tolerate. Available effect values are: "NoSchedule", "PreferNoSchedule", "NoExecute".'
            gpu_partition_mode: '- (Optional) The AMD GPU partition mode to use for nodes in this pool. Valid values are AMD_PARTITION_MODE_SPX_NPS1 and AMD_PARTITION_MODE_DPX_NPS2. This can only be set when the pool is created.'
            id: '-  A unique ID that can be used to identify and reference the node pool.'
            key: '- An arbitrary string. The "key" and "value" fields of the "taint" object form a key-value pair.'
            labels: '- (Optional) A map of key/value pairs to apply to nodes in the pool. The labels are exposed in the Kubernetes API as labels in the metadata of the corresponding Node resources.'
            max_nodes: '- (Optional) If auto-scaling is enabled, this represents the maximum number of nodes that the node pool can be scaled up to.'
            min_nodes: '- (Optional) If auto-scaling is enabled, this represents the minimum number of nodes that the node pool can be scaled down to.'
            name: '- (Required) A name for the node pool.'
            node_count: '- (Optional) The number of Droplet instances in the node pool. If auto-scaling is enabled, this should only be set if the desired result is to explicitly reset the number of nodes to this value. If auto-scaling is enabled, and the node count is outside of the given min/max range, it will use the min nodes value.'
            nodes: '- A list of nodes in the pool. Each node exports the following attributes:'
            size: '- (Required) The slug identifier for the type of Droplet to be used as workers in the node pool.'
            status: '-  A string indicating the current status of the individual node.'
            tags: '- (Optional) A list of tag names to be applied to the Kubernetes cluster.'
            taint: '- (Optional) A list of taints applied to all nodes in the pool.'
            updated_at: '- The date and time when the node was last updated.'
            value: '- An arbitrary string. The "key" and "value" fields of the "taint" object form a key-value pair.'
        importStatements: []
    digitalocean_loadbalancer:
        subCategory: Networking
        name: digitalocean_loadbalancer
        title: digitalocean_loadbalancer
        examples:
            - name: public
              manifest: |-
                {
                  "droplet_ids": [
                    "${digitalocean_droplet.web.id}"
                  ],
                  "forwarding_rule": [
                    {
                      "entry_port": 80,
                      "entry_protocol": "http",
                      "target_port": 80,
                      "target_protocol": "http"
                    }
                  ],
                  "healthcheck": [
                    {
                      "port": 22,
                      "protocol": "tcp"
                    }
                  ],
                  "name": "loadbalancer-1",
                  "region": "nyc3"
                }
              references:
                droplet_ids: digitalocean_droplet.web.id
              dependencies:
                digitalocean_droplet.web: |-
                    {
                      "image": "ubuntu-18-04-x64",
                      "name": "web-1",
                      "region": "nyc3",
                      "size": "s-1vcpu-1gb"
                    }
            - name: public
              manifest: |-
                {
                  "droplet_ids": [
                    "${digitalocean_droplet.web.id}"
                  ],
                  "forwarding_rule": [
                    {
                      "certificate_name": "${digitalocean_certificate.cert.name}",
                      "entry_port": 443,
                      "entry_protocol": "https",
                      "target_port": 80,
                      "target_protocol": "http"
                    }
                  ],
                  "healthcheck": [
                    {
                      "port": 22,
                      "protocol": "tcp"
                    }
                  ],
                  "name": "loadbalancer-1",
                  "region": "nyc3"
                }
              references:
                droplet_ids: digitalocean_droplet.web.id
                forwarding_rule.certificate_name: digitalocean_certificate.cert.name
              dependencies:
                digitalocean_certificate.cert: |-
                    {
                      "leaf_certificate": "file('cert.pem')",
                      "lifecycle": [
                        {
                          "create_before_destroy": true
                        }
                      ],
                      "name": "cert",
                      "private_key": "file('key.pem')"
                    }
                digitalocean_droplet.web: |-
                    {
                      "image": "ubuntu-18-04-x64",
                      "name": "web-1",
                      "region": "nyc3",
                      "size": "s-1vcpu-1gb"
                    }
        argumentDocs:
            algorithm: |-
                - (Optional) Deprecated This field has been deprecated. You can no longer specify an algorithm for load balancers.
                or least_connections. The default value is round_robin.
            allow: '- (Optional) A list of strings describing allow rules. Must be colon delimited strings of the form {type}:{source}'
            cdn: '- (Optional) CDN configuration supporting the following:'
            certificate_id: '- (Optional) Deprecated The ID of the TLS certificate to be used for SSL termination. Use certificate_name instead.'
            certificate_name: '- (Optional) The unique name of the TLS certificate to be used for SSL termination.'
            check_interval_seconds: '- (Optional) The number of seconds between two consecutive health checks. If not specified, the default value is 10.'
            cookie_name: '- (Optional) The name to be used for the cookie sent to the client. This attribute is required when using cookies for the sticky sessions type.'
            cookie_ttl_seconds: '- (Optional) The number of seconds until the cookie set by the Load Balancer expires. This attribute is required when using cookies for the sticky sessions type.'
            deny: '- (Optional) A list of strings describing deny rules. Must be colon delimited strings of the form {type}:{source}'
            deny = ["cidr:1.2.0.0/16", "ip:2.3.4.5"]: or allow = ["ip:1.2.3.4", "cidr:2.3.4.0/24"]
            disable_lets_encrypt_dns_records: '- (Optional) A boolean value indicating whether to disable automatic DNS record creation for Let''s Encrypt certificates that are added to the load balancer. Default value is false.'
            domains: (Optional) - A list of domains required to ingress traffic to a Global Load Balancer. The domains block is documented below.
            droplet_ids: (Optional) - A list of the IDs of each droplet to be attached to the Load Balancer.
            droplet_tag: (Optional) - The name of a Droplet tag corresponding to Droplets to be assigned to the Load Balancer.
            enable_backend_keepalive: '- (Optional) A boolean value indicating whether HTTP keepalive connections are maintained to target Droplets. Default value is false.'
            enable_proxy_protocol: |-
                - (Optional) A boolean value indicating whether PROXY
                Protocol should be used to pass information from connecting client requests to
                the backend service. Default value is false.
            entry_port: '- (Required) An integer representing the port on which the Load Balancer instance will listen.'
            entry_protocol: '- (Required) The protocol used for traffic to the Load Balancer. The possible values are: http, https, http2, http3, tcp, or udp.'
            firewall: (Optional) - A block containing rules for allowing/denying traffic to the Load Balancer. The firewall block is documented below. Only 1 firewall is allowed.
            forwarding_rule: |-
                - (Required) A list of forwarding_rule to be assigned to the
                Load Balancer. The forwarding_rule block is documented below.
            glb_settings: (Optional) - A block containing glb_settings required to define target rules for a Global Load Balancer. The glb_settings block is documented below.
            healthcheck: |-
                - (Optional) A healthcheck block to be assigned to the
                Load Balancer. The healthcheck block is documented below. Only 1 healthcheck is allowed.
            healthy_threshold: '- (Optional) The number of times a health check must pass for a backend Droplet to be marked "healthy" and be re-added to the pool. If not specified, the default value is 5.'
            http_idle_timeout_seconds: '- (Optional) Specifies the idle timeout for HTTPS connections on the load balancer in seconds.'
            id: '- The ID of the Load Balancer'
            ip: '- The ip of the Load Balancer'
            is_enabled: '- (Optional) Control flag to specify if caching is enabled.'
            is_managed: '- (Optional) Control flag to specify whether the domain is managed by DigitalOcean.'
            name: '- (Required) The Load Balancer name'
            network: '- (Optional) The type of network the Load Balancer is accessible from. It must be either of INTERNAL or EXTERNAL. Defaults to EXTERNAL.'
            network_stack: '- (Optional) The network stack determines the allocation of ipv4/ipv6 addresses to the load balancer. It must be either of IPV4 or DUALSTACK. Defaults to IPV4.'
            path: '- (Optional) The path on the backend Droplets to which the Load Balancer instance will send a request.'
            port: '- (Optional) An integer representing the port on the backend Droplets on which the health check will attempt a connection.'
            project_id: '- (Optional) The ID of the project that the load balancer is associated with. If no ID is provided at creation, the load balancer associates with the user''s default project.'
            protocol: '- (Required) The protocol used for health checks sent to the backend Droplets. The possible values are http, https or tcp.'
            redirect_http_to_https: |-
                - (Optional) A boolean value indicating whether
                HTTP requests to the Load Balancer on port 80 will be redirected to HTTPS on port 443.
                Default value is false.
            region: '- (Required) The region to start in'
            response_timeout_seconds: '- (Optional) The number of seconds the Load Balancer instance will wait for a response until marking a health check as failed. If not specified, the default value is 5.'
            size: '- (Optional) The size of the Load Balancer. It must be either lb-small, lb-medium, or lb-large. Defaults to lb-small. Only one of size or size_unit may be provided.'
            size_unit: '- (Optional) The size of the Load Balancer. It must be in the range (1, 200). Defaults to 1. Only one of size or size_unit may be provided.'
            sticky_sessions: |-
                - (Optional) A sticky_sessions block to be assigned to the
                Load Balancer. The sticky_sessions block is documented below. Only 1 sticky_sessions block is allowed.
            subnet_uuid: '- (Optional) The ID of the VPC subnet where the load balancer will be located. Must be a valid subnet in the specified VPC. Requires that vpc_uuid is also set.'
            target_load_balancer_ids: (Optional) - A list of Load Balancer IDs to be attached behind a Global Load Balancer.
            target_port: '- (Required) An integer representing the port on the backend Droplets to which the Load Balancer will send traffic.'
            target_protocol: '- (Required) The protocol used for traffic from the Load Balancer to the backend Droplets. The possible values are: http, https, http2, tcp, or udp.'
            tls_cipher_policy: '- (Optional) The tls cipher policy controls the cipher suites to be used by the load balancer. It must be either of DEFAULT or STRONG. Defaults to DEFAULT.'
            tls_passthrough: '- (Optional) A boolean value indicating whether SSL encrypted traffic will be passed through to the backend Droplets. The default value is false.'
            type: '- (Optional) The type of the Load Balancer. It must be either of REGIONAL, REGIONAL_NETWORK, or GLOBAL. Defaults to REGIONAL.'
            unhealthy_threshold: '- (Optional) The number of times a health check must fail for a backend Droplet to be marked "unhealthy" and be removed from the pool. If not specified, the default value is 3.'
            urn: '- The uniform resource name for the Load Balancer'
            vpc_uuid: '- (Optional) The ID of the VPC where the load balancer will be located.'
        importStatements: []
    digitalocean_microvm:
        subCategory: MicroVMs
        name: digitalocean_microvm
        title: digitalocean_microvm
        examples:
            - name: web
              manifest: |-
                {
                  "auto_pause": [
                    {
                      "enabled": true,
                      "idle_timeout": "5m"
                    }
                  ],
                  "environment": {
                    "LOG_LEVEL": "info"
                  },
                  "http_port": 8080,
                  "name": "example-microvm",
                  "region": "nyc3",
                  "size": [
                    {
                      "cpu": 2,
                      "memory": 4096
                    }
                  ],
                  "source": [
                    {
                      "oci_ref": "docker.io/library/nginx:latest"
                    }
                  ],
                  "tags": [
                    "web"
                  ]
                }
            - name: worker
              manifest: |-
                {
                  "name": "example-worker",
                  "region": "nyc3",
                  "size": [
                    {
                      "cpu": 1,
                      "memory": 2048
                    }
                  ],
                  "source": [
                    {
                      "oci_ref": "docker.io/library/alpine:latest"
                    }
                  ],
                  "state": "paused"
                }
            - name: restored
              manifest: |-
                {
                  "name": "example-restored",
                  "source": [
                    {
                      "checkpoint_id": "${digitalocean_microvm_checkpoint.snapshot.id}"
                    }
                  ]
                }
              references:
                source.checkpoint_id: digitalocean_microvm_checkpoint.snapshot.id
              dependencies:
                digitalocean_microvm_checkpoint.snapshot: |-
                    {
                      "microvm_id": "${digitalocean_microvm.web.id}",
                      "name": "web-checkpoint"
                    }
            - name: locked_down
              manifest: |-
                {
                  "egress_policy": [
                    {
                      "default_action": "deny",
                      "rule": [
                        {
                          "domain": "api.example.com"
                        },
                        {
                          "domain": "*.example.org"
                        },
                        {
                          "ip": "203.0.113.5"
                        }
                      ]
                    }
                  ],
                  "name": "example-locked-down",
                  "region": "nyc3",
                  "size": [
                    {
                      "cpu": 1,
                      "memory": 2048
                    }
                  ],
                  "source": [
                    {
                      "oci_ref": "docker.io/library/alpine:latest"
                    }
                  ]
                }
        argumentDocs:
            auto_pause: '- (Optional) Auto-pause configuration. When omitted, the product default (enabled) applies.'
            auto_resume: '- (Optional) Whether the MicroVM resumes automatically on incoming HTTP traffic. When omitted, the product default (enabled) applies.'
            checkpoint_id: '- (Optional) The ID of a checkpoint to restore.'
            cpu: '- (Required) The number of vCPUs.'
            created_at: '- The date and time the MicroVM was created.'
            current_state: '- The observed lifecycle state of the MicroVM, such as running or paused.'
            default: '- Whether this is the default URL.'
            default_action: '- (Optional) What to do with a destination no rule matches: deny or allow. Defaults to deny.'
            domain: '- An exact host such as api.example.com, or a wildcard such as *.example.com.'
            egress_policy: '- (Optional) An outbound allow list. When omitted, egress is unrestricted; a MicroVM restored from a checkpoint inherits its origin''s policy. Only valid with public networking, and a change forces a new MicroVM.'
            enabled: '- (Required) Whether the MicroVM pauses after it has been idle for idle_timeout.'
            environment: '- (Optional) A map of environment variables to pass to the workload.'
            failure_reason: '- A description of the failure when current_state is failed.'
            hostname: '- The hostname, without a scheme.'
            http_port: '- (Optional) The port the workload serves HTTP on.'
            http_protocol: '- (Optional) The HTTP protocol the workload serves: http or http2.'
            id: '- The ID of the MicroVM.'
            idle_timeout: '- (Optional) How long the MicroVM must be idle before it pauses, as a duration such as 5m or 30s.'
            ingress_enabled: '- (Optional) Whether the MicroVM is created with a default public ingress URL. Defaults to true. Set to false to create the MicroVM without a default URL; additional URLs can be added later with the digitalocean_microvm_ingress resource. This is a create-time option, so a change forces a new MicroVM.'
            ip: '- An exact IP address. CIDR ranges are not supported.'
            memory: '- (Required) The amount of memory in MiB.'
            name: '- (Required) The name of the MicroVM.'
            networking: '- (Optional) The networking mode: public or vpc.'
            oci_ref: '- (Optional) The OCI reference of the workload container image, such as docker.io/library/nginx:latest.'
            port: '- The guest port the URL forwards to.'
            ports: '- (Optional) A list of guest ports to open for ingress. Defaults to http_port only.'
            region: '- (Optional) The slug of the region to create the MicroVM in. Required when creating from source.oci_ref; inherited from the checkpoint when omitted on a restore.'
            rule: '- (Optional) An allowed destination. Up to 50 rules. Rules match the host only: port, path and method are not considered, and a hostname that resolves to an IP is not matched by an ip rule. Each rule sets exactly one of:'
            size: '- (Optional) The compute size of the MicroVM. Required when creating from source.oci_ref; inherited from the checkpoint when omitted on a restore.'
            size.0.disk: '- The size of the attached disk in GB.'
            source: '- (Required) What the MicroVM runs. Exactly one of the following must be set:'
            state: '- (Optional) The desired lifecycle state: running or paused. Defaults to running. When auto_pause is enabled, a MicroVM that the platform has paused is not resumed to match running.'
            status: '- The URL status: PENDING or ACTIVE.'
            tags: '- (Optional) A list of tag names to apply to the MicroVM.'
            urls: '- A list of ingress URLs for the MicroVM:'
            urn: '- The uniform resource name (URN) for the MicroVM.'
            vpc_uuid: '- (Optional) The ID of the VPC to place the MicroVM in. Only valid when networking is vpc.'
        importStatements: []
    digitalocean_microvm_checkpoint:
        subCategory: MicroVMs
        name: digitalocean_microvm_checkpoint
        title: digitalocean_microvm_checkpoint
        examples:
            - name: web
              manifest: |-
                {
                  "microvm_id": "${digitalocean_microvm.web.id}",
                  "name": "web-checkpoint"
                }
              references:
                microvm_id: digitalocean_microvm.web.id
              dependencies:
                digitalocean_microvm.web: |-
                    {
                      "name": "example-microvm",
                      "region": "nyc3",
                      "size": [
                        {
                          "cpu": 2,
                          "memory": 4096
                        }
                      ],
                      "source": [
                        {
                          "oci_ref": "docker.io/library/nginx:latest"
                        }
                      ]
                    }
        argumentDocs:
            cpu: '- The number of vCPUs.'
            created_at: '- The date and time the checkpoint was created.'
            disk: '- The size of the disk in GB.'
            disk_bytes: '- The size of the persisted disk image in bytes.'
            id: '- The ID of the checkpoint.'
            memory: '- The amount of memory in MiB.'
            memory_bytes: '- The size of the persisted memory image in bytes.'
            microvm_id: '- (Required) The ID of the running MicroVM to checkpoint. Changing this forces a new checkpoint.'
            microvm_name: '- The name of the MicroVM the checkpoint was captured from.'
            name: '- (Optional) A name for the checkpoint. Changing this forces a new checkpoint.'
            region: '- The slug of the region the checkpoint is stored in.'
            size: '- The size a MicroVM restored from this checkpoint inherits. Empty when the checkpoint does not record one, in which case the restored MicroVM must set size.'
            status: '- The status of the checkpoint, such as CHECKPOINT_AVAILABLE.'
        importStatements: []
    digitalocean_microvm_ingress:
        subCategory: MicroVMs
        name: digitalocean_microvm_ingress
        title: digitalocean_microvm_ingress
        examples:
            - name: admin
              manifest: |-
                {
                  "microvm_id": "${digitalocean_microvm.web.id}",
                  "port": 9090
                }
              references:
                microvm_id: digitalocean_microvm.web.id
              dependencies:
                digitalocean_microvm.web: |-
                    {
                      "http_port": 8080,
                      "name": "example-microvm",
                      "ports": [
                        8080,
                        9090
                      ],
                      "region": "nyc3",
                      "size": [
                        {
                          "cpu": 2,
                          "memory": 4096
                        }
                      ],
                      "source": [
                        {
                          "oci_ref": "docker.io/library/nginx:latest"
                        }
                      ]
                    }
            - name: api
              manifest: |-
                {
                  "microvm_id": "${digitalocean_microvm.api.id}"
                }
              references:
                microvm_id: digitalocean_microvm.api.id
              dependencies:
                digitalocean_microvm.api: |-
                    {
                      "ingress_enabled": false,
                      "name": "example-api",
                      "region": "nyc3",
                      "size": [
                        {
                          "cpu": 2,
                          "memory": 4096
                        }
                      ],
                      "source": [
                        {
                          "oci_ref": "docker.io/library/nginx:latest"
                        }
                      ]
                    }
        argumentDocs:
            default: '- Whether this is the MicroVM''s system default URL.'
            hostname: '- The assigned hostname, without a scheme.'
            id: '- The stable identifier of the URL.'
            microvm_id: '- (Required) The ID of the MicroVM to add the URL to. Changing this forces a new URL.'
            port: '- (Optional) The guest port the URL routes to. Must be one of the MicroVM''s ports. Defaults to the MicroVM''s http_port when omitted. Changing this forces a new URL.'
            status: '- The URL status: PENDING or ACTIVE.'
            url_id: '- The stable identifier of the URL (same as id).'
        importStatements: []
    digitalocean_monitor_alert:
        subCategory: Monitoring
        name: digitalocean_monitor_alert
        title: digitalocean_monitor_alert
        examples:
            - name: cpu_alert
              manifest: |-
                {
                  "alerts": [
                    {
                      "email": [
                        "sammy@digitalocean.com"
                      ],
                      "slack": [
                        {
                          "channel": "Production Alerts",
                          "url": "https://hooks.slack.com/services/T1234567/AAAAAAAA/ZZZZZZ"
                        }
                      ]
                    }
                  ],
                  "compare": "GreaterThan",
                  "description": "Alert about CPU usage",
                  "enabled": true,
                  "entities": [
                    "${digitalocean_droplet.web.id}"
                  ],
                  "type": "v1/insights/droplet/cpu",
                  "value": 95,
                  "window": "5m"
                }
              references:
                entities: digitalocean_droplet.web.id
              dependencies:
                digitalocean_droplet.web: |-
                    {
                      "image": "ubuntu-20-04-x64",
                      "name": "web-1",
                      "region": "nyc2",
                      "size": "s-1vcpu-1gb"
                    }
        argumentDocs:
            alerts: |-
                - (Required) How to send notifications about the alerts. This is a list with one element, .
                Note that for Slack, the DigitalOcean app needs to have permissions for your workspace. You can
                read more in Slack's documentation
            compare: |-
                - (Required) The comparison for value.
                This may be either GreaterThan or LessThan.
            description: '- (Required) The description of the alert.'
            enabled: '- (Required) The status of the alert.'
            entities: '- A list of IDs for the resources to which the alert policy applies.'
            tags: '- A list of tags. When an included tag is added to a resource, the alert policy will apply to it.'
            type: |-
                - (Required) The type of the alert.
                This may be one of v1/insights/droplet/load_1, v1/insights/droplet/load_5, v1/insights/droplet/load_15,
                v1/insights/droplet/memory_utilization_percent, v1/insights/droplet/disk_utilization_percent,
                v1/insights/droplet/cpu, v1/insights/droplet/disk_read, v1/insights/droplet/disk_write,
                v1/insights/droplet/public_outbound_bandwidth, v1/insights/droplet/public_inbound_bandwidth,
                v1/insights/droplet/private_outbound_bandwidth, v1/insights/droplet/private_inbound_bandwidth,
                v1/insights/lbaas/avg_cpu_utilization_percent, v1/insights/lbaas/connection_utilization_percent,
                v1/insights/lbaas/droplet_health, v1/insights/lbaas/tls_connections_per_second_utilization_percent,
                v1/insights/lbaas/increase_in_http_error_rate_percentage_5xx, v1/insights/lbaas/increase_in_http_error_rate_percentage_4xx,
                v1/insights/lbaas/increase_in_http_error_rate_count_5xx, v1/insights/lbaas/increase_in_http_error_rate_count_4xx,
                v1/insights/lbaas/high_http_request_response_time, v1/insights/lbaas/high_http_request_response_time_50p,
                v1/insights/lbaas/high_http_request_response_time_95p, v1/insights/lbaas/high_http_request_response_time_99p,

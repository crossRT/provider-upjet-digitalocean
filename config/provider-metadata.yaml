                }
            - name: public
              manifest: |-
                {
                  "enable_public_endpoint": true,
                  "model_deployments": [
                    {
                      "accelerators": [
                        {
                          "accelerator_slug": "gpu-h100x1-80gb",
                          "scale": 1,
                          "type": "nvidia_h100"
                        }
                      ],
                      "model_provider": "digitalocean",
                      "model_slug": "deepseek-r1-distill-qwen-14b"
                    }
                  ],
                  "name": "my-public-inference",

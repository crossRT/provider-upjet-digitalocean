    digitalocean_droplet:
        subCategory: Droplets
        name: digitalocean_droplet
        title: digitalocean_droplet
        examples:
            - name: web
              manifest: |-
                {
                  "backup_policy": [
                    {
                      "hour": 8,
                      "plan": "weekly",
                      "weekday": "TUE"
                    }
                  ],
                  "backups": true,
                  "image": "ubuntu-20-04-x64",
                  "name": "web-1",
                  "region": "nyc2",
                  "size": "s-1vcpu-1gb"
                }
        argumentDocs:
            backup_policy: '- (Optional) An object specifying the backup policy for the Droplet. If omitted and backups is true, the backup plan will default to daily.'
            backups: |-
                - (Optional) Boolean controlling if backups are made. Defaults to
                false.
            disk: '- The size of the instance''s disk in GB'
            droplet_agent: |-
                (Optional) - A boolean indicating whether to install the
                DigitalOcean agent used for providing access to the Droplet web console in
                the control panel. By default, the agent is installed on new Droplets but
                installation errors (i.e. OS not supported) are ignored. To prevent it from
                being installed, set to false. To make installation errors fatal, explicitly
                set it to true.
            gpu_partition_mode: |-
                (Optional) - The partition mode for a GPU Droplet. Omit to
                create a full GPU (equivalent to PARTITION_MODE_SPX_NPS1). Valid values are
                PARTITION_MODE_SPX_NPS1 and PARTITION_MODE_DPX_NPS2. Only supported on GPU
                sizes that advertise the mode in their supported_partition_modes (see the
                digitalocean_sizes data source). Changing this forces a new resource to be
                created.
            graceful_shutdown: |-
                (Optional) - A boolean indicating whether the droplet
                should be gracefully shut down before it is deleted.
            hour: '- The hour of the day that the backup window will start (0, 4, 8, 12, 16, 20).'
            id: '- The ID of the Droplet'
            image: '- (Required) The Droplet image ID or slug. This could be either image ID or droplet snapshot ID. You can find image IDs and slugs using the DigitalOcean API.'
            ipv4_address: '- The IPv4 address'
            ipv4_address_private: '- The private networking IPv4 address'
            ipv6: |-
                - (Optional) Boolean controlling if IPv6 is enabled. Defaults to false.
                Once enabled for a Droplet, IPv6 can not be disabled. When enabling IPv6 on
                an existing Droplet, additional OS-level configuration
                is required.
            ipv6_address: '- The IPv6 address'
            locked: '- Is the Droplet locked'
            monitoring: |-
                - (Optional) Boolean controlling whether monitoring agent is installed.
                Defaults to false. If set to true, you can configure monitor alert policies
                monitor alert resource
            name: '- (Required) The Droplet name.'
            plan: '- The backup plan used for the Droplet. The plan can be either daily or weekly.'
            price_hourly: '- Droplet hourly price'
            price_monthly: '- Droplet monthly price'
            private_networking: |-
                - (Optional) Deprecated Boolean controlling if private networking
                is enabled. This parameter has been deprecated. Use vpc_uuid instead to specify a VPC network for the Droplet. If no vpc_uuid is provided, the Droplet will be placed in your account's default VPC for the region.
            public_networking: |-
                (Optional) - A boolean indicating whether to enables public networking for the Droplet or not.
                By default, this is always enabled on new droplets.
                But, by explicitly setting it to false, you can create a droplet with public networking entirely disabled.
            region: '- The region where the Droplet will be created.'
            resize_disk: |-
                - (Optional) Boolean controlling whether to increase the disk
                size when resizing a Droplet. It defaults to true. When set to false,
                only the Droplet's RAM and CPU will be resized. Increasing a Droplet's disk
                size is a permanent change. Increasing only RAM and CPU is reversible.
            size: '- (Required) The unique slug that identifies the type of Droplet. You may list the available slugs using the DigitalOcean API.'
            ssh_keys: |-
                - (Optional) A list of SSH key IDs or fingerprints to enable in
                the format [12345, 123456]. To retrieve this info, use the
                DigitalOcean API
                or CLI (doctl compute ssh-key list). Once a Droplet is created keys can not
                be added or removed via this provider. Modifying this field will prompt you
                to destroy and recreate the Droplet.
            status: '- The status of the Droplet'
            tags: '- (Optional) A list of the tags to be applied to this Droplet.'
            urn: '- The uniform resource name of the Droplet'
            user_data: (Optional) - A string of the desired User Data provided during Droplet creation. Changing this forces a new resource to be created.
            vcpus: '- The number of the instance''s virtual CPUs'
            volume_ids: (Optional) - A list of the IDs of each block storage volume to be attached to the Droplet.
            vpc_uuid: '- (Optional) The ID of the VPC where the Droplet will be located.'
            weekday: '- The day of the week on which the backup will occur (SUN, MON, TUE, WED, THU, FRI, SAT).'
        importStatements: []
    digitalocean_droplet_autoscale:
        subCategory: Droplets
        name: digitalocean_droplet_autoscale
        title: digitalocean_droplet_autoscale
        examples:
            - name: my-autoscale-pool
              manifest: |-
                {
                  "config": [
                    {
                      "cooldown_minutes": 5,
                      "max_instances": 50,
                      "min_instances": 10,
                      "target_cpu_utilization": 0.5,
                      "target_memory_utilization": 0.5
                    }
                  ],
                  "droplet_template": [
                    {
                      "image": "ubuntu-24-04-x64",
                      "ipv6": true,
                      "public_networking": false,
                      "region": "nyc3",
                      "size": "c-2",
                      "ssh_keys": [
                        "${digitalocean_ssh_key.my-ssh-key.id}"
                      ],
                      "tags": [
                        "${digitalocean_tag.my-tag.id}"
                      ],
                      "user_data": "\n#cloud-config\nruncmd:\n- apt-get update\n- apt-get install -y stress-ng\n",
                      "with_droplet_agent": true
                    }
                  ],
                  "name": "terraform-example"
                }
              references:
                droplet_template.ssh_keys: digitalocean_ssh_key.my-ssh-key.id
                droplet_template.tags: digitalocean_tag.my-tag.id
              dependencies:
                digitalocean_ssh_key.my-ssh-key: |-
                    {
                      "name": "terraform-example",
                      "public_key": "${file(\"/Users/terraform/.ssh/id_rsa.pub\")}"
                    }
                digitalocean_tag.my-tag: |-
                    {
                      "name": "terraform-example"
                    }
        argumentDocs:
            config: |-
                - (Required) The configuration parameters for Droplet Autoscale pool, the supported arguments are
                documented below.
            cooldown_minutes: '- The cooldown duration between scaling events for the Droplet Autoscale pool.'
            created_at: '- Created at timestamp for the Droplet Autoscale pool.'
            current_utilization: |-
                - The current average resource utilization of the Droplet Autoscale pool, this attribute further
                embeds memory and cpu attributes to respectively report utilization data.
            droplet_template: |-
                - (Required) The droplet template parameters for Droplet Autoscale pool, the supported arguments
                are documented below.
            id: '- The ID of the Droplet Autoscale pool.'
            image: '- (Required) Image slug of the Droplet Autoscale pool underlying resource(s).'
            ipv6: '- Boolean flag to enable IPv6 networking on the Droplet Autoscale pool underlying resource(s).'
            max_instances: '- The maximum number of instances to maintain in the Droplet Autoscale pool.'
            min_instances: '- The minimum number of instances to maintain in the Droplet Autoscale pool.'
            name: '- (Required) The name of the Droplet Autoscale pool.'
            project_id: '- Project UUID to create the Droplet Autoscale pool underlying resource(s).'
            public_networking: (Optional) - A boolean indicating whether to enables public networking for the Droplet or not. By default, this is always enabled on new droplets. But, by explicitly setting it to false, you can create a droplet with public networking entirely disabled.
            region: '- (Required) Region slug of the Droplet Autoscale pool underlying resource(s).'
            size: '- (Required) Size slug of the Droplet Autoscale pool underlying resource(s).'
            ssh_keys: '- (Required) SSH fingerprints to add to the Droplet Autoscale pool underlying resource(s).'
            status: |-
                - Droplet Autoscale pool health status; this reflects if the pool is currently healthy and ready to accept
                traffic, or in an error state and needs user intervention.
            tags: '- List of tags to add to the Droplet Autoscale pool underlying resource(s).'
            target_cpu_utilization: '- The target average CPU load (in range [0, 1]) to maintain in the Droplet Autoscale pool.'
            target_memory_utilization: |-
                - The target average Memory load (in range [0, 1]) to maintain in the Droplet Autoscale
                pool.
            target_number_instances: |-
                - The static number of instances to maintain in the pool Droplet Autoscale pool. This
                argument cannot be used with any other config options.
            updated_at: '- Updated at timestamp for the Droplet Autoscale pool.'
            user_data: |-
                - Custom user data that can be added to the Droplet Autoscale pool underlying resource(s). This can be a
                cloud init script that user may configure to setup their application workload.
            vpc_uuid: |-
                - VPC UUID to create the Droplet Autoscale pool underlying resource(s). If not provided, this is inferred
                from the specified region (default VPC).
            with_droplet_agent: |-
                - Boolean flag to enable metric agent on the Droplet Autoscale pool underlying resource(s). The
                metric agent enables collecting resource utilization metrics, which allows making resource based scaling decisions.
        importStatements: []
    digitalocean_droplet_snapshot:

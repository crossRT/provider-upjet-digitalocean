                }
            - name: private
              manifest: |-
                {
                  "model_deployments": [
                    {
                      "accelerators": [
                        {
                          "accelerator_slug": "gpu-h100x1-80gb",
                          "scale": 1,
                          "type": "nvidia_h100"
                        }
                      ],
                      "model_provider": "digitalocean",
